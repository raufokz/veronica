name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One pipeline at a time per branch — a newer push cancels an in-flight run so
# migrations and deploys never interleave.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_PROJECT_REF: altbyubhdvnetvnsmtkm

jobs:
  # ---------------------------------------------------------------
  # 1. Lint + type check. Runs on every push and pull request.
  # ---------------------------------------------------------------
  verify:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

  # ---------------------------------------------------------------
  # 2. Push new Supabase migrations. main only, after verify passes.
  #    Skips itself (without failing) until the Supabase secrets exist.
  # ---------------------------------------------------------------
  migrate:
    name: Supabase migrations
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push'
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for Supabase secrets
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD not set — skipping migrations."
            exit 0
          fi
          case "$SUPABASE_ACCESS_TOKEN" in
            sbp_*) ;;
            *)
              echo "::error::SUPABASE_ACCESS_TOKEN must be a personal access token starting with sbp_ (create one at https://supabase.com/dashboard/account/tokens). The anon key, service-role key and database password will not work here."
              exit 1
              ;;
          esac
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true'
        with:
          version: latest

      - name: Link project
        if: steps.check.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Show pending migrations
        if: steps.check.outputs.ready == 'true'
        run: supabase migration list

      - name: Apply migrations
        if: steps.check.outputs.ready == 'true'
        run: supabase db push

  # ---------------------------------------------------------------
  # 3. Deploy to Vercel — only after the database is up to date, so a
  #    build that reads a new column never lands before the column does.
  #    Skips itself (without failing) if you deploy via Vercel's own Git
  #    integration instead of tokens.
  # ---------------------------------------------------------------
  deploy:
    name: Vercel deploy
    runs-on: ubuntu-latest
    needs: [verify, migrate]
    # `always()` so a skipped migrate job doesn't cascade into a skipped deploy.
    if: always() && needs.verify.result == 'success' && needs.migrate.result != 'failure'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for Vercel secrets
        id: check
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Vercel secrets not set — skipping deploy (Vercel's Git integration may be handling it)."
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 24

      - name: Install Vercel CLI
        if: steps.check.outputs.ready == 'true'
        run: npm install --global vercel@latest

      # Diagnostic: shows who the token authenticates as and which teams and
      # projects it can see. `vercel pull` failing with "Could not retrieve
      # Project Settings" almost always means the answer here is "not this team".
      - name: Inspect token access
        if: steps.check.outputs.ready == 'true'
        continue-on-error: true
        run: |
          echo "--- whoami ---"
          vercel whoami --token="$VERCEL_TOKEN" || echo "whoami FAILED — token is invalid or expired"
          echo "--- teams the token can see ---"
          vercel teams ls --token="$VERCEL_TOKEN" || echo "teams ls FAILED"
          echo "--- projects in $VERCEL_ORG_ID ---"
          vercel project ls --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN" || echo "project ls FAILED — the token cannot see this team"

      # Production for pushes to main, preview for pull requests.
      - name: Pull environment
        if: steps.check.outputs.ready == 'true'
        run: |
          ENV=${{ github.event_name == 'push' && 'production' || 'preview' }}
          vercel pull --yes --environment="$ENV" --token="$VERCEL_TOKEN"

      - name: Build
        if: steps.check.outputs.ready == 'true'
        run: vercel build ${{ github.event_name == 'push' && '--prod' || '' }} --token="$VERCEL_TOKEN"

      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        run: |
          URL=$(vercel deploy --prebuilt ${{ github.event_name == 'push' && '--prod' || '' }} --token="$VERCEL_TOKEN")
          echo "Deployed: $URL"
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
